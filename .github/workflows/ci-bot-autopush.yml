name: ci-bot-autopush

on:
  workflow_run:
    workflows: ["quality-gate"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  autopush:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          token: ${{ secrets.BOT_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Prepare bot identity
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"

      - name: Generate change summary
        run: |
          mkdir -p reports
          echo "module: platform" > reports/ci-change-summary.txt
          echo "summary: quality gate passed and bot auto-push pipeline executed." >> reports/ci-change-summary.txt
          echo "risk: low" >> reports/ci-change-summary.txt
          echo "source_run: ${{ github.event.workflow_run.id }}" >> reports/ci-change-summary.txt

      - name: Commit generated artifacts
        id: commit_step
        run: |
          git add reports/ci-change-summary.txt
          if git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          BRANCH="codex/ci-bot-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git commit -m "chore(ci): bot autopush report [risk:low]"
          git push origin "$BRANCH"
          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: ${{ steps.commit_step.outputs.has_changes == 'true' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BOT_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "chore(ci): bot autopush report",
              head: "${{ steps.commit_step.outputs.branch }}",
              base: "${{ github.event.workflow_run.head_branch }}",
              body: "Auto-generated by CI bot after quality-gate success."
            })
