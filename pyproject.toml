[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-agent-platform"
version = "0.1.0"
description = "Enterprise-grade multi-agent platform scaffold with FastAPI, LangGraph, RAG, tools, skills, and memory."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.32",
  "alembic>=1.13.2",
  "pymysql>=1.1.1",
  "pymilvus>=2.4.6",
  "redis>=5.0.7",
  "pyjwt>=2.9.0",
  "prometheus-client>=0.20.0",
  "opentelemetry-api>=1.26.0",
  "opentelemetry-sdk>=1.26.0",
  "opentelemetry-instrumentation-fastapi>=0.47b0",
  "langchain==1.2.12",
  "langgraph==1.1.2",
  "llama-index-core>=0.10.64",
  "llama-index-readers-file>=0.1.33",
  "pandas>=2.2.2",
  "openpyxl>=3.1.5",
  "python-docx>=1.1.2",
  "pypdf>=4.3.1",
  "requests>=2.32.3",
  "beautifulsoup4>=4.12.3",
  "pyyaml>=6.0.2",
  "python-json-logger>=2.0.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.23.8",
  "httpx>=0.27.0",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
